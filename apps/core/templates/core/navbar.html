{% load static %}
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
  <div class="container">
    <a class="navbar-brand d-flex flex-column align-items-center" href="{% url 'core:home' %}">
      <img src="{% static 'img/logo.svg' %}" alt="SENDA Logo" height="70" class="d-inline-block align-top">
      <small class="slogan-text d-none d-sm-block">Cada paso cuenta</small>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item"><a class="nav-link" href="{% url 'products:catalogo_generos' %}">Catálogos</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'products:genero_detalle' "Hombre" %}">Hombre</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'products:genero_detalle' "Mujer" %}">Mujer</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'core:about' %}">Sobre Nosotros</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'users:acceso_mayoristas' %}">Acceso Mayoristas</a></li>
        
        {% if user.is_authenticated %}
            <li class="nav-item">
                <form action="{% url 'users:logout' %}" method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-link nav-link text-decoration-none shadow-none">Cerrar Sesión</button>
                </form>
            </li>
            <li class="nav-item"><span class="nav-link">Hola, {{ user.first_name }}!</span></li>
        {% else %}
            <li class="nav-item"><a class="nav-link" href="{% url 'users:login' %}">Iniciar Sesión</a></li>
        {% endif %}
        
        <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
          <a class="nav-link position-relative d-inline-block" href="{% url 'cart:carrito_detalle' %}">
            <i class="fa-solid fa-cart-shopping fs-5"></i>
            <span class="badge rounded-pill bg-dark position-absolute top-0 start-100 translate-middle">
                {{ carrito|length }}
            </span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
