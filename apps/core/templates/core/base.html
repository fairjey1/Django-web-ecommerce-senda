{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ site_config.site_name }} | Cada paso cuenta{% endblock %}</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>

    {% include 'core/navbar.html' %}

    {% if messages %}
        <div class="container mt-3">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <main>
        {% block content %}
        {% endblock content %}
    </main>

    {% include 'core/footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const botonesVerMas = document.querySelectorAll('.btn-load-more');
    
    botonesVerMas.forEach(boton => {
        boton.addEventListener('click', function() {
            // Recolectar datos del botón
            const tipo = this.dataset.tipo;
            const generoId = this.dataset.genero || '';
            const containerId = this.dataset.container;
            let nextPage = parseInt(this.dataset.page) + 1;
            
            // Estado visual de carga
            const textoOriginal = this.innerHTML;
            this.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Cargando...';
            this.disabled = true;
            
            // Llamar a nuestra nueva URL de Django
            fetch(`/cargar-mas/?tipo=${tipo}&page=${nextPage}&genero_id=${generoId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.html) {
                        const contenedor = document.getElementById(containerId);
                        // Pegar las nuevas tarjetas sin borrar las anteriores
                        contenedor.insertAdjacentHTML('beforeend', data.html);
                    }
                    
                    // Si hay más páginas, actualizamos el contador. Si no, ocultamos el botón.
                    if (data.has_next) {
                        this.dataset.page = nextPage;
                        this.innerHTML = textoOriginal;
                        this.disabled = false;
                    } else {
                        this.remove(); 
                    }
                })
                .catch(error => {
                    console.error('Error al cargar productos:', error);
                    this.innerHTML = 'Error de conexión';
                    this.disabled = false;
                });
        });
    });
});
</script>
</body>
</html>
