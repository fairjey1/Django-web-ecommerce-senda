{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ site_config.site_name }} | Cada paso cuenta{% endblock %}</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>

    {% include 'core/navbar.html' %}

    {% if messages %}
        <div class="container mt-3">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <main>
        {% block content %}
        {% endblock content %}
    </main>

    {% include 'core/footer.html' %}

<a href="https://wa.me/{{ site_config.phone_number }}/?text=Hola%20SENDA!%20Visité%20la%20web%20y%20quería%20hacerles%20una%20consulta." 
   class="whatsapp-btn-float shadow d-flex align-items-center justify-content-center" 
   target="_blank" 
   title="Chatear por WhatsApp">
    <i class="bi bi-whatsapp"></i>
</a>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        document.body.addEventListener('click', function(e) {
            const boton = e.target.closest('.btn-load-more');
            
            if (boton) {
                const tipo = boton.dataset.tipo;
                const generoId = boton.dataset.genero || '';
                const categoriaId = boton.dataset.categoria || ''; // NUEVO
                const subcategoria = boton.dataset.subcategoria || ''; // NUEVO
                const containerId = boton.dataset.container;
                let nextPage = parseInt(boton.dataset.page) + 1;
                
                const selectOrden = document.getElementById('ordenar');
                const orden = selectOrden ? selectOrden.value : 'novedades';
                
                const textoOriginal = boton.innerHTML;
                boton.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Cargando...';
                boton.disabled = true;
                
                // NUEVO: Agregamos categoria_id y subcategoria a la URL
                fetch(`/cargar-mas/?tipo=${tipo}&page=${nextPage}&genero_id=${generoId}&categoria_id=${categoriaId}&subcategoria=${subcategoria}&orden=${orden}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.html) {
                            const contenedor = document.getElementById(containerId);
                            contenedor.insertAdjacentHTML('beforeend', data.html);
                        }
                        
                        if (data.has_next) {
                            boton.dataset.page = nextPage;
                            boton.innerHTML = textoOriginal;
                            boton.disabled = false;
                        } else {
                            boton.remove(); 
                        }
                    })
                    .catch(error => {
                        console.error('Error al cargar:', error);
                        boton.innerHTML = 'Error al cargar';
                        boton.disabled = false;
                    });
            }
        });
    });
</script>
</body>
</html>
