{% extends 'core/base.html' %}

{% block title %}Pago Pendiente | SENDA{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 text-center">
            <div class="card shadow-sm border-0 rounded-4 p-5">
                <i class="bi bi-hourglass-split text-warning mb-4" style="font-size: 4.5rem;"></i>
                
                <h2 class="fw-bold mb-3 text-dark">¡Pago Pendiente!</h2>
                
                <p class="fs-5 text-secondary mb-4">
                    Tu pago está siendo procesado. Te notificaremos por correo una vez que se complete la acreditación.
                </p>
                
                <a href="{% url 'core:home' %}" class="btn btn-lg text-white rounded-3 shadow-sm text-uppercase fw-bold w-100 py-3" style="background-color: var(--color-primario, #8796AA); letter-spacing: 1px;">
                    Volver al Inicio
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
