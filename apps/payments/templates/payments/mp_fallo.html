{% extends 'core/base.html' %}

{% block title %}Pago Rechazado | SENDA{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 text-center">
            <div class="card shadow-sm border-0 rounded-4 p-5">
                <i class="bi bi-x-circle-fill text-danger mb-4" style="font-size: 4.5rem;"></i>
                
                <h2 class="fw-bold mb-3 text-dark">¡Pago Rechazado!</h2>
                
                <p class="fs-5 text-secondary mb-4">
                    Lo sentimos, tu pago no pudo ser procesado o fue cancelado. No te preocupes, tus productos siguen guardados.
                </p>
                
                <div class="d-grid gap-3">
                    <a href="{% url 'cart:carrito_detalle' %}" class="btn btn-lg text-white rounded-3 shadow-sm text-uppercase fw-bold py-3" style="background-color: var(--color-primario, #8796AA); letter-spacing: 1px;">
                        Intentar de Nuevo
                    </a>
                    <a href="{% url 'core:home' %}" class="btn btn-outline-secondary rounded-3 text-uppercase fw-bold py-2">
                        Ir al Inicio
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
