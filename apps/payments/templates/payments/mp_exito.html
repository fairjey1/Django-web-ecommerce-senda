{% extends 'core/base.html' %}

{% block title %}Pago Exitoso | SENDA{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 text-center">
            <div class="card shadow-sm border-0 rounded-4 p-5">
                <i class="bi bi-check-circle-fill text-success mb-4" style="font-size: 4.5rem;"></i>
                
                <h2 class="fw-bold mb-3" style="color: var(--color-primario, #8796AA);">¡Pago Aprobado!</h2>
                
                <p class="fs-5 text-secondary mb-4">
                    Gracias por tu compra. Tu pedido <strong class="text-dark">#{{ pedido_id }}</strong> ha sido procesado con éxito.
                </p>
                
                <div class="bg-light rounded-3 p-3 mb-4 border">
                    <small class="text-muted d-block mb-1 text-uppercase fw-semibold" style="font-size: 0.8rem;">Comprobante de transacción MP:</small>
                    <span class="font-monospace text-dark fs-5">{{ payment_id }}</span>
                </div>
                
                <a href="{% url 'core:home' %}" class="btn btn-lg text-white rounded-3 shadow-sm text-uppercase fw-bold w-100 py-3" style="background-color: var(--color-primario, #8796AA); letter-spacing: 1px;">
                    Volver al Inicio
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
